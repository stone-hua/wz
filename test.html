        <div class="relative z-10 max-w-4xl mx-auto backdrop-blur-sm p-8 rounded-3xl border border-white/10 bg-black/40 mt-[250px] md:mt-0">
            <div class="inline-block px-4 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold mb-6 border border-blue-500/30 animate-pulse">2026 线下实战营</div>
            <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-6 leading-tight" id="course-title"></h1>
            <p class="text-slate-300 text-lg mb-8 max-w-2xl mx-auto">从“思维认知”到“暗黑落地”，全网硬核实战交付。</p>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="#products" class="px-8 py-3 bg-blue-600 text-white rounded-full font-bold shadow-lg shadow-blue-600/30 hover:bg-blue-500 transition">探索产品体系</a>
                <a href="javascript:void(0)" onclick="openProductDetail(0)" class="px-8 py-3 bg-white/10 backdrop-blur text-white border border-white/20 rounded-full font-bold hover:bg-white/20 transition">最近开课</a>
            </div>
        </div>
    </header>

    <!-- 3. 产品体系 -->
    <section id="products" class="py-20">
        <div class="max-w-5xl mx-auto px-6">
            <div class="text-center mb-12">
                <h2 class="section-title">产品与服务</h2>
                <p class="text-slate-400">我们提供从个人成长到企业落地的全方位解决方案</p>
            </div>
            <div class="grid md:grid-cols-2 gap-8" id="product-entry-cards"></div>
        </div>
    </section>

    <!-- 4. 实战案例 -->
    <section id="cases" class="py-20 bg-slate-900/50">
        <div class="max-w-5xl mx-auto px-6">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-3xl font-bold text-white mb-2">标杆实战案例</h2>
                    <p class="text-slate-400 text-sm">真实落地数据，拒绝空谈</p>
                </div>
                <button onclick="openListLayer('cases')" class="text-blue-400 hover:text-white transition font-bold text-sm flex items-center gap-1 group">
                    查看全部案例 <i class="fas fa-arrow-right group-hover:translate-x-1 transition"></i>
                </button>
            </div>
            <div id="cases-preview" class="grid md:grid-cols-2 gap-8"></div>
        </div>
    </section>

    <!-- 5. 适合人群 & 权益 (已移除，移入产品详情) -->

    <!-- 6. 开课信息 (已移除，移入产品详情) -->

    <!-- 7. AI 文章 -->
    <section id="articles" class="py-20 bg-slate-900/30">
        <div class="max-w-5xl mx-auto px-6">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-3xl font-bold text-white mb-2">深度干货</h2>
                    <p class="text-slate-400 text-sm">华哥的实战思考与复盘</p>
                </div>
                <button onclick="openListLayer('articles')" class="text-blue-400 hover:text-white transition font-bold text-sm flex items-center gap-1 group">
                    阅读更多干货 <i class="fas fa-arrow-right group-hover:translate-x-1 transition"></i>
                </button>
            </div>
            <div id="articles-preview" class="grid md:grid-cols-3 gap-6"></div>
        </div>
    </section>

    <!-- 8. 导师介绍 -->
    <section id="instructor" class="py-20">
        <div class="max-w-4xl mx-auto px-6">
            <div class="dark-card p-8 md:p-12 flex flex-col md:flex-row items-center gap-10">
                <img id="inst-img" class="w-40 h-40 rounded-full object-cover shadow-2xl border-4 border-slate-700" alt="Mentor">
                <div class="flex-1 text-center md:text-left">
                    <h2 class="text-3xl font-bold text-white mb-2" id="inst-name"></h2>
                    <p class="text-blue-400 font-bold mb-6" id="inst-title"></p>
                    <div id="inst-desc" class="space-y-4 text-slate-400 leading-relaxed text-sm"></div>
                    <div class="mt-8 flex gap-4 justify-center md:justify-start">
                         <button onclick="openDetailLayer('instructor')" class="px-6 py-2 border border-slate-500/30 text-slate-300 rounded-full hover:bg-slate-500/10 transition text-sm">查看详细履历</button>
                         <button onclick="toggleContact()" class="px-6 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-500 transition text-sm font-bold">添加微信</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 9. 关于我们 -->
    <section id="about" class="py-20 bg-slate-900/30">
        <div class="max-w-3xl mx-auto px-4 text-center">
            <h2 class="section-title">关于我们</h2>
            <p id="about-desc" class="text-lg text-slate-400 leading-relaxed mb-8"></p>
            <button onclick="openDetailLayer('about')" class="text-blue-400 hover:text-blue-300 underline underline-offset-4">查看公司详细介绍</button>
        </div>
    </section>

    <footer class="bg-slate-950 text-slate-600 py-10 text-center text-xs border-t border-slate-900">
        <p>© 2026 华哥架构工作室 | All Rights Reserved</p>
    </footer>

    <!-- ==================== 二级页面系统 (全屏层) ==================== -->
    
    <!-- 1. 列表页层 -->
    <div id="list-layer" class="sub-page-layer">
        <div class="page-header">
            <div class="font-bold text-lg text-white" id="list-layer-title">全部内容</div>
            <button onclick="closeListLayer()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <div class="page-scroll-area">
            <div class="max-w-5xl mx-auto" id="list-layer-content"></div>
        </div>
    </div>

    <!-- 2. 详情页层 -->
    <div id="detail-layer" class="sub-page-layer" style="z-index: 101;">
        <div class="page-header">
            <button onclick="closeDetailLayer()" class="flex items-center gap-2 text-slate-400 hover:text-white text-sm font-bold">
                <i class="fas fa-arrow-left"></i> 返回
            </button>
            <div class="font-bold text-white truncate max-w-[200px]" id="detail-layer-title">详情</div>
            <div class="w-8"></div>
        </div>
        <div class="page-scroll-area bg-slate-900">
            <div class="max-w-4xl mx-auto">
                <div id="detail-layer-content" class="article-body px-4"></div>
            </div>
        </div>
        <div class="float-btn-container">
            <button onclick="toggleContact()" class="float-btn">
                <i class="fab fa-weixin"></i> 咨询华哥 / 立即报名
            </button>
        </div>
    </div>

    <!-- 3. 二维码弹窗 -->
    <div id="contact-modal" class="modal-overlay" onclick="closeModal(event, 'contact-modal')">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-[90%] text-center shadow-2xl relative animate-up">
            <button onclick="toggleContact()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-900"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-xl font-bold text-slate-900 mb-2">扫码咨询 / 报名</h3>
            <p class="text-xs text-slate-500 mb-6">名额有限，请直接添加华哥微信锁定</p>
            <img id="modal-qr" class="w-48 h-48 rounded-lg mx-auto mb-4 border p-1" alt="QR">
            <div class="py-3 px-4 rounded-xl flex justify-between items-center bg-slate-50 cursor-pointer" onclick="copyWechat()">
                <span class="text-slate-500 text-xs">微信号：</span><span class="font-mono font-bold text-slate-800" id="modal-wechat"></span><i class="fas fa-copy text-blue-500"></i>
            </div>
            <p id="copy-tip" class="text-[10px] text-green-500 mt-2 h-4 opacity-0 transition">已复制微信号</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const d = CONFIG;
            document.getElementById('nav-logo').innerText = d.siteInfo.logoText;
            document.getElementById('nav-btn-text').innerText = d.siteInfo.contactBtnText;
            document.getElementById('course-title').innerText = d.siteInfo.title;
            document.getElementById('modal-qr').src = d.siteInfo.qrCode;
            document.getElementById('modal-wechat').innerText = d.siteInfo.wechatId;

            // 1. 渲染产品卡片
            const prodDiv = document.getElementById('product-entry-cards');
            d.products.forEach((p, idx) => {
                prodDiv.innerHTML += `
                    <div class="dark-card group cursor-pointer relative h-[360px] flex flex-col" onclick="openProductDetail(${idx})">
                        <div class="h-48 overflow-hidden relative">
                            <div class="absolute top-3 right-3 bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded shadow">${p.tag}</div>
                            <img src="${p.cover}" class="w-full h-full object-cover transition duration-700 group-hover:scale-110 opacity-80 group-hover:opacity-100" alt="${p.name}">
                        </div>
                        <div class="p-8 flex-1 flex flex-col relative z-10 bg-slate-800/90">
                            <h3 class="text-2xl font-bold text-white mb-2 group-hover:text-blue-400 transition">${p.name}</h3>
                            <div class="text-slate-400 text-sm leading-relaxed mb-4 flex-1 line-clamp-3 overflow-hidden">${p.desc.replace(/<[^>]+>/g, '')}</div>
                            <div class="text-blue-400 text-sm font-bold flex items-center gap-2">查看课程大纲 <i class="fas fa-arrow-right group-hover:translate-x-1 transition"></i></div>
                        </div>
                    </div>`;
            });

            // 2. 渲染案例
            const casesDiv = document.getElementById('cases-preview');
            d.cases.slice(0, 2).forEach((c) => { casesDiv.innerHTML += createCaseCardHTML(c); });

            // 3. 渲染文章
            const artDiv = document.getElementById('articles-preview');
            d.articles.slice(0, 3).forEach((a) => { artDiv.innerHTML += createArticleCardHTML(a); });

            // 导师与关于我们
            document.getElementById('inst-name').innerText = d.instructor.name;
            document.getElementById('inst-title').innerText = d.instructor.title;
            document.getElementById('inst-img').src = d.instructor.image;
            document.getElementById('inst-desc').innerHTML = d.instructor.shortDesc.map(p => `<p>${p}</p>`).join('');
            document.getElementById('about-desc').innerHTML = d.about.desc;
        });

        /* --- 辅助函数 --- */
        function createCaseCardHTML(c) {
            return `<div onclick="openDetailLayer('case', ${c.id})" class="dark-card group cursor-pointer hover:border-blue-500/30">
                <div class="h-48 overflow-hidden relative"><img src="${c.image}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105"><div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-slate-900 to-transparent p-4 pt-10"><span class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded font-bold uppercase">${c.tag}</span></div></div>
                <div class="p-6"><h3 class="text-lg font-bold text-white mb-2 truncate group-hover:text-blue-400 transition">${c.title}</h3><p class="text-green-400 font-bold text-sm mb-2"><i class="fas fa-chart-line mr-1"></i> ${c.result}</p></div></div>`;
        }
        function createArticleCardHTML(a) {
            return `<div onclick="openDetailLayer('article', ${a.id})" class="dark-card p-6 cursor-pointer group flex flex-col h-full hover:border-blue-500/30">
                <div class="mb-3 flex justify-between items-center"><span class="text-[10px] text-blue-400 font-mono bg-blue-900/30 px-2 py-0.5 rounded">${a.date}</span></div>
                <h3 class="text-base font-bold text-white group-hover:text-blue-400 transition mb-3 line-clamp-2">${a.title}</h3><p class="text-sm text-slate-400 line-clamp-2 mb-4 flex-1">${a.summary}</p><div class="pt-3 border-t border-slate-700 text-xs font-bold text-slate-500 flex justify-between items-center"><span>阅读全文</span> <i class="fas fa-arrow-right group-hover:translate-x-1 transition"></i></div></div>`;
        }

        /* --- 1. 列表页交互 (修复背景滚动 bug) --- */
        function openListLayer(type) {
            const layer = document.getElementById('list-layer');
            const title = document.getElementById('list-layer-title');
            const content = document.getElementById('list-layer-content');
            
            content.innerHTML = "";
            layer.classList.add('active');
            document.body.style.overflow = 'hidden'; // 锁死背景滚动

            if (type === 'cases') {
                title.innerText = "全部实战案例库";
                content.className = "max-w-6xl mx-auto grid md:grid-cols-3 gap-6";
                CONFIG.cases.forEach(c => { content.innerHTML += createCaseCardHTML(c); });
            } else if (type === 'articles') {
                title.innerText = "全部深度干货";
                content.className = "max-w-5xl mx-auto grid md:grid-cols-2 gap-6"; 
                CONFIG.articles.forEach(a => { content.innerHTML += createArticleCardHTML(a); });
            }
        }
        function closeListLayer() {
            document.getElementById('list-layer').classList.remove('active');
            document.body.style.overflow = ''; 
        }

        /* --- 2. 通用详情交互 --- */
        function openDetailLayer(type, id) {
            const layer = document.getElementById('detail-layer');
            const title = document.getElementById('detail-layer-title');
            const content = document.getElementById('detail-layer-content');
            
            document.body.style.overflow = 'hidden';

            let data = {};
            if (type === 'case') data = CONFIG.cases.find(c => c.id === id);
            else if (type === 'article') data = CONFIG.articles.find(a => a.id === id);
            else if (type === 'instructor') data = { title: "导师介绍", content: CONFIG.instructor.detail };
            else if (type === 'about') data = { title: "关于我们", content: CONFIG.about.detail };

            if(data) {
                title.innerText = data.title || data.name; 
                let html = "";
                if(data.image) html += `<img src="${data.image}" class="w-full rounded-xl mb-6">`;
                html += `<div>${data.content}</div>`;
                content.innerHTML = html;
            }
            layer.classList.add('active');
        }

        /* --- 3. 产品详情交互 (重构 UI，集成人群/权益/开课信息) --- */
        function openProductDetail(index) {
            const prod = CONFIG.products[index];
            const layer = document.getElementById('detail-layer');
            const title = document.getElementById('detail-layer-title');
            const content = document.getElementById('detail-layer-content');

            document.body.style.overflow = 'hidden';
            title.innerText = prod.name;
            
            // 顶部图
            let html = `<div class="mb-8"><img src="${prod.cover}" class="w-full rounded-xl border border-white/10 shadow-2xl"></div>`;
            
            // 模块列表 (截图风格)
            prod.modules.forEach(mod => {
                const itemsHtml = mod.items.map(it => `<li class="product-item">${it}</li>`).join('');
                html += `<div class="product-module-container"><div class="product-module-header"><span class="${mod.color || 'bg-blue-500'} product-module-bar"></span><h3 class="product-module-title">${mod.title}</h3></div><ul class="product-item-list">${itemsHtml}</ul></div>`;
            });

            // 附加信息：适合人群
            if(prod.targets) {
                const targetsHtml = prod.targets.map(t => `<span class="inline-block bg-white/10 px-3 py-1 rounded-full text-sm text-slate-300 mr-2 mb-2"># ${t}</span>`).join('');
                html += `<div class="detail-info-box"><div class="detail-info-title"><i class="fas fa-users text-blue-400"></i> 适合人群</div><div>${targetsHtml}</div></div>`;
            }

            // 附加信息：权益
            if(prod.benefits) {
                const benefitsHtml = prod.benefits.map(b => `<li class="mb-2 text-sm text-slate-300 flex items-start gap-2"><i class="fas fa-check-circle text-green-500 mt-1"></i> <span>${b}</span></li>`).join('');
                html += `<div class="detail-info-box"><div class="detail-info-title"><i class="fas fa-gift text-yellow-500"></i> 课程权益</div><ul class="list-none">${benefitsHtml}</ul></div>`;
            }

            // 附加信息：开课信息
            if(prod.eventInfo) {
                const ei = prod.eventInfo;
                html += `<div class="detail-info-box border-blue-500/30 bg-blue-900/10"><div class="detail-info-title"><i class="fas fa-calendar-alt text-blue-400"></i> 开课信息</div>
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div><div class="text-slate-500 text-xs">时间</div><div class="text-white font-bold">${ei.time}</div></div>
                    <div><div class="text-slate-500 text-xs">地点</div><div class="text-white font-bold">${ei.location}</div></div>
                    <div><div class="text-slate-500 text-xs">费用</div><div class="text-blue-400 font-bold">${ei.price}</div></div>
                    <div><div class="text-slate-500 text-xs">优惠</div><div class="text-amber-400 font-bold">${ei.offer}</div></div>
                </div></div>`;
            }
            
            // 附加信息：承诺
            if(prod.promise) {
                 const promiseHtml = prod.promise.map(p => `<p class="text-sm text-slate-400 mb-2">${p}</p>`).join('');
                 html += `<div class="detail-info-box border-green-500/20"><div class="detail-info-title"><i class="fas fa-shield-alt text-green-500"></i> 硬核承诺</div>${promiseHtml}</div>`;
            }

            content.innerHTML = html;
            layer.classList.add('active');
        }

        function closeDetailLayer() {
            document.getElementById('detail-layer').classList.remove('active');
            if(!document.getElementById('list-layer').classList.contains('active')) {
                document.body.style.overflow = '';
            }
        }

        function toggleMobileMenu() { document.getElementById('mobile-menu-panel').classList.toggle('open'); document.getElementById('mobile-menu-overlay').classList.toggle('open'); }
        function toggleContact() { const m = document.getElementById('contact-modal'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
        function closeModal(e, id) { if (e.target.id === id) document.getElementById(id).style.display='none'; }
        function copyWechat() { navigator.clipboard.writeText(CONFIG.siteInfo.wechatId).then(() => { document.getElementById('copy-tip').style.opacity = 1; setTimeout(() => document.getElementById('copy-tip').style.opacity = 0, 2000); }); }
    </script>
</body>
</html>
