<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华哥 - AI商业架构师</title>
    <!-- 引入 Tailwind CSS (为了好看的样式，自动加载，不用管) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        /* 弹窗动画 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="pb-20">

    <!-- ============================================================ -->
    <!-- 🟢 华哥配置区 (在这里修改网站内容，不需要懂代码！) -->
    <!-- ============================================================ -->
    <script>
        const WEBSITE_DATA = {
            // 1. 个人基础信息
            info: {
                name: "华哥",
                title: "AI 商业架构师",
                slogan: "让 AI 成为老板的思维延伸，构建永不离职的数字员工团队。",
                // 头像图片链接
                avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&h=200&fit=crop", 
                // 详细介绍 (支持换行)
                bio: "深耕销售心理学与自动化技术多年，擅长将复杂的企业业务流程转化为 AI 逻辑流。\n\n通过 Dify + 自动化架构，已助力超过 100 家企业实现数字化转型。我不仅教技术，更教如何用 AI 降维打击竞争对手。",
                wechat: "Huage_AI_2026", // 微信号
                // 微信二维码图片链接
                qrCode: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=Huage_AI_2026" 
            },
            
            // 2. 产品列表
            products: [
                {
                    title: "AI 商业架构实战营",
                    price: "¥ 9,980",
                    desc: "从思维到落地，带走 5 套工业级智能体。",
                    detail: "这门课专门为老板设计。我们会现场拆解你的业务，并手把手教你如何用 Dify 搭建出属于你的销冠智能体。\n\n包含服务：\n1. 2天1夜线下集训\n2. 21天社群陪跑\n3. 终身复训权益"
                },
                {
                    title: "Dify 智能体代建服务",
                    price: "¥ 49,800 起",
                    desc: "全流程自动化闭环设计，企业私有化部署。",
                    detail: "我们团队将深度介入你的业务，为你量身定制一套 Dify 工作流。从获客、初筛、分配到跟进，全自动化运行，数据实时同步 Google Sheets。"
                }
            ],

            // 3. 成功案例
            cases: [
                {
                    title: "房产销冠分身系统",
                    tag: "置业公司",
                    result: "成交转化率提升 400%",
                    detail: "我们将该公司的销冠谈单记录进行脱敏训练，构建了 Dify 引导模型。现在新人入职第一天就能达到老销售 80% 的谈单水平。"
                },
                {
                    title: "心理督导 AI 自动化",
                    tag: "心理机构",
                    result: "人力成本降低 80%",
                    detail: "实现了咨询记录的自动摘要、专业督导建议生成及代理商授权额度的全自动核销管理。"
                }
            ],

            // 4. 文章观点
            articles: [
                { title: "为什么老板必须掌握 AI 架构思维？", date: "2026-01-10", content: "这里是文章正文...\n\nAI 时代，老板不再需要卷体力，而是需要卷逻辑。如果你不懂架构，招再多 AI 工程师也是浪费..." },
                { title: "如何用 Dify 重构你的销售漏斗？", date: "2026-01-08", content: "销售漏斗的第一步是获客。通过 AI 智能体在前端进行 24 小时响应..." }
            ]
        };
    </script>
    <!-- ================= 配置区结束 ================= -->


    <!-- 导航栏 -->
    <nav class="fixed top-0 w-full z-50 bg-slate-950/90 backdrop-blur border-b border-white/10">
        <div class="max-w-4xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="text-lg font-bold text-white tracking-wider">HUAGED<span class="text-blue-500">.AI</span></div>
            <button onclick="openModal('资料领取', '请填写下方表单，系统将自动发送资料到您的手机。', 'form')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-full text-sm font-bold transition">领取资料</button>
        </div>
    </nav>

    <!-- 个人展示区 (Hero) -->
    <section class="pt-32 pb-12 px-6 text-center max-w-3xl mx-auto">
        <div class="inline-block px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-bold mb-6">
            ✨ 2026 AI 商业领航
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-6 leading-tight">
            我是<span id="display-name"></span>，<br/><span class="gradient-text">用 AI 重构你的生意</span>
        </h1>
        <p id="display-slogan" class="text-slate-400 text-lg mb-10"></p>

        <!-- 留资表单 -->
        <div class="glass-card p-6 rounded-3xl shadow-2xl max-w-md mx-auto text-left">
            <form onsubmit="submitForm(event)" class="space-y-4">
                <div class="flex flex-col gap-3">
                    <input type="text" id="lead-name" placeholder="您的姓名" required class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
                    <input type="tel" id="lead-phone" placeholder="手机号" required class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    立即领取《AI 落地红利指南》 <i class="fas fa-paper-plane"></i>
                </button>
                <div class="flex items-start gap-2">
                     <input type="checkbox" id="agree" required class="mt-1">
                     <label for="agree" class="text-[10px] text-slate-500 cursor-pointer">我已阅读并同意《隐私政策》，授权联系我以提供资料。</label>
                </div>
            </form>
        </div>
    </section>

    <!-- 关于我 -->
    <section class="px-6 py-8 max-w-3xl mx-auto">
        <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><span class="w-1 h-6 bg-blue-500 rounded-full"></span>关于我</h2>
        <div class="glass-card p-6 rounded-3xl flex flex-col md:flex-row items-center gap-6">
            <img id="display-avatar" class="w-24 h-24 rounded-2xl object-cover border-2 border-white/10">
            <div class="text-center md:text-left flex-1">
                <h3 class="text-lg font-bold text-white mb-2" id="display-title"></h3>
                <p id="display-bio-short" class="text-slate-400 text-sm leading-relaxed line-clamp-3 mb-4"></p>
                <button onclick="showBio()" class="text-blue-400 text-sm font-bold hover:text-blue-300">查看详细履历 &gt;</button>
            </div>
        </div>
    </section>

    <!-- 产品服务 -->
    <section class="px-6 py-8 max-w-3xl mx-auto">
        <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2 flex-row-reverse"><span class="w-1 h-6 bg-indigo-500 rounded-full"></span>产品服务</h2>
        <div id="products-container" class="space-y-4"></div>
    </section>

    <!-- 成功案例 -->
    <section class="px-6 py-8 max-w-3xl mx-auto">
        <div class="bg-blue-900/10 rounded-[2rem] p-6 border border-blue-500/10">
            <h2 class="text-xl font-bold text-white mb-6 text-center">成功案例</h2>
            <div id="cases-container" class="space-y-4"></div>
        </div>
    </section>

    <!-- 文章动态 -->
    <section class="px-6 py-8 max-w-3xl mx-auto">
        <h2 class="text-xl font-bold text-white mb-6">深度思考</h2>
        <div id="articles-container" class="grid gap-3"></div>
    </section>

    <!-- 联系我们 -->
    <section class="px-6 py-12 max-w-3xl mx-auto text-center border-t border-white/5 mt-8">
        <h2 class="text-xl font-bold text-white mb-6">联系华哥</h2>
        <div class="bg-white p-2 inline-block rounded-xl mb-4">
            <img id="display-qr" class="w-32 h-32" alt="QR">
        </div>
        <p class="text-slate-400 mb-1 font-mono" id="display-wechat"></p>
        <p class="text-xs text-slate-600">扫码或搜索微信号，备注“官网咨询”</p>
    </section>

    <!-- 通用弹窗 -->
    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="bg-slate-900 border border-white/10 w-full max-w-md rounded-2xl p-6 relative">
            <button onclick="document.getElementById('modal').classList.remove('active')" class="absolute top-4 right-4 text-slate-500 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            <div id="modal-tag" class="text-blue-500 text-xs font-bold uppercase tracking-widest mb-2">详情</div>
            <h3 id="modal-title" class="text-2xl font-bold text-white mb-4">标题</h3>
            <div id="modal-content" class="text-slate-400 leading-relaxed text-sm whitespace-pre-wrap max-h-[60vh] overflow-y-auto">
                内容...
            </div>
            <!-- 弹窗内的表单插槽 -->
            <div id="modal-form-slot" class="hidden mt-4"></div>
        </div>
    </div>

    <script>
        // --- 初始化渲染逻辑 ---
        document.addEventListener('DOMContentLoaded', () => {
            const d = WEBSITE_DATA;

            // 1. 个人信息
            document.getElementById('display-name').innerText = d.info.name;
            document.getElementById('display-slogan').innerText = d.info.motto; // 注意: 代码里用的motto, 配置里用的slogan, 修正一下
            document.getElementById('display-slogan').innerText = d.info.slogan;
            document.getElementById('display-avatar').src = d.info.avatar;
            document.getElementById('display-title').innerText = `${d.info.name} · ${d.info.title}`;
            document.getElementById('display-bio-short').innerText = d.info.bio;
            document.getElementById('display-qr').src = d.info.qrCode;
            document.getElementById('display-wechat').innerText = `微信号：${d.info.wechat}`;

            // 2. 产品
            const prodContainer = document.getElementById('products-container');
            d.products.forEach(p => {
                const el = document.createElement('div');
                el.className = 'glass-card p-5 rounded-2xl hover:border-blue-500/30 transition cursor-pointer group';
                el.onclick = () => openModal(p.title, p.detail, '产品服务');
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-bold text-white">${p.title}</h3>
                        <span class="text-blue-400 font-bold">${p.price}</span>
                    </div>
                    <p class="text-slate-500 text-sm">${p.desc}</p>
                    <div class="mt-3 text-xs text-blue-500/50 group-hover:text-blue-400 font-bold flex items-center gap-1">查看详情 <i class="fas fa-chevron-right"></i></div>
                `;
                prodContainer.appendChild(el);
            });

            // 3. 案例
            const caseContainer = document.getElementById('cases-container');
            d.cases.forEach(c => {
                const el = document.createElement('div');
                el.className = 'bg-slate-950 p-5 rounded-2xl border border-white/5 flex justify-between items-center cursor-pointer hover:bg-slate-900 transition';
                el.onclick = () => openModal(c.title, c.detail, '成功案例');
                el.innerHTML = `
                    <div>
                        <p class="text-[10px] text-blue-500 font-bold uppercase mb-1">${c.tag}</p>
                        <h3 class="text-base font-bold text-white">${c.title}</h3>
                        <p class="text-xs text-emerald-400 mt-1 font-bold">${c.result}</p>
                    </div>
                    <i class="fas fa-chevron-right text-slate-700"></i>
                `;
                caseContainer.appendChild(el);
            });

            // 4. 文章
            const artContainer = document.getElementById('articles-container');
            d.articles.forEach(a => {
                const el = document.createElement('div');
                el.className = 'flex gap-3 items-start p-4 bg-white/5 rounded-xl cursor-pointer hover:bg-white/10 transition';
                el.onclick = () => openModal(a.title, a.content, '深度观点');
                el.innerHTML = `
                    <div class="text-xs text-slate-500 font-mono pt-1 min-w-[80px]">${a.date}</div>
                    <div class="font-bold text-slate-300 text-sm hover:text-blue-400">${a.title}</div>
                `;
                artContainer.appendChild(el);
            });
        });

        // --- 交互逻辑 ---

        function openModal(title, content, tag) {
            document.getElementById('modal-tag').innerText = tag || '详情';
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerText = content;
            document.getElementById('modal').classList.add('active');
        }

        function showBio() {
            openModal("详细履历", WEBSITE_DATA.info.bio, "关于我");
        }

        function closeModal(e) {
            if (e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        }

        function submitForm(e) {
            e.preventDefault();
            const name = document.getElementById('lead-name').value;
            const phone = document.getElementById('lead-phone').value;
            
            // 这里仅仅是前端模拟成功，实际上没有存数据库
            // 如果要存，需要结合之前的 Google Script 逻辑 fetch 发送
            
            alert(`提交成功！\n\n感谢 ${name}，系统已记录您的手机 ${phone}。\n稍后助手会将资料发送给您。`);
            e.target.reset();
        }
    </script>
</body>
</html>
