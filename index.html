<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth dark"> <!-- 默认深色模式 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能体实战应用 | 华哥架构</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: '#0f172a', light: '#ffffff' } } } }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 基础 */
        body { font-family: -apple-system, 'PingFang SC', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* 日夜模式变量 */
        .dark body { background-color: #0f172a; color: #cbd5e1; }
        .light body { background-color: #f8fafc; color: #1e293b; }

        /* 导航栏 */
        .glass-nav { 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background-color 0.3s;
        }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.85); }
        .light .glass-nav { background: rgba(255, 255, 255, 0.85); border-bottom: 1px solid rgba(0,0,0,0.05); }

        /* ★★★ 新侧边栏 (iOS 风格) ★★★ */
        #mobile-menu-overlay {
            position: fixed; inset: 0; z-index: 90;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #mobile-menu-overlay.open { opacity: 1; pointer-events: auto; }

        #mobile-menu-panel {
            position: fixed; top: 0; right: 0; bottom: 0; width: 75%; max-width: 300px;
            z-index: 91; padding: 2rem;
            transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; justify-content: center;
        }
        .dark #mobile-menu-panel { background: rgba(30, 41, 59, 0.98); border-left: 1px solid rgba(255,255,255,0.1); }
        .light #mobile-menu-panel { background: rgba(255, 255, 255, 0.98); border-left: 1px solid rgba(0,0,0,0.1); box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        
        #mobile-menu-panel.open { transform: translateX(0); }

        /* 菜单项动画 */
        .menu-link { 
            font-size: 1.25rem; font-weight: 600; padding: 1rem 0; 
            border-bottom: 1px solid rgba(128,128,128,0.1); 
            text-align: center; opacity: 0; transform: translateY(10px); transition: 0.3s;
        }
        #mobile-menu-panel.open .menu-link { opacity: 1; transform: translateY(0); }
        /* 延迟动画 */
        #mobile-menu-panel.open .menu-link:nth-child(1) { transition-delay: 0.1s; }
        #mobile-menu-panel.open .menu-link:nth-child(2) { transition-delay: 0.15s; }
        #mobile-menu-panel.open .menu-link:nth-child(3) { transition-delay: 0.2s; }
        #mobile-menu-panel.open .menu-link:nth-child(4) { transition-delay: 0.25s; }

        /* Hero 背景图 */
        .hero-section { 
            background-size: cover; background-position: center; min-height: 500px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        /* 这里的遮罩保证文字清晰 */
        .hero-overlay { position: absolute; inset: 0; }
        .dark .hero-overlay { background: linear-gradient(to bottom, rgba(15,23,42,0.4), #0f172a); }
        .light .hero-overlay { background: linear-gradient(to bottom, rgba(255,255,255,0.4), #f8fafc); }

        /* 卡片 */
        .card { border-radius: 1.5rem; transition: all 0.3s ease; border: 1px solid transparent; }
        .dark .card { background: #1e293b; border-color: rgba(255,255,255,0.05); }
        .light .card { background: #ffffff; border-color: rgba(0,0,0,0.05); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-5px); }
        .dark .card:hover { box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3); background: #263346; }
        .light .card:hover { box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); }

        /* 通用文字适配 */
        .text-main { transition: color 0.3s; }
        .dark .text-main { color: #f8fafc; }
        .light .text-main { color: #0f172a; }

        .text-sub { transition: color 0.3s; }
        .dark .text-sub { color: #94a3b8; }
        .light .text-sub { color: #64748b; }

        /* 弹窗 */
        .modal-bg { transition: background 0.3s; }
        .dark .modal-bg { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); }
        .light .modal-bg { background: #ffffff; border: 1px solid rgba(0,0,0,0.1); }
        
        .modal-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid; }
        .dark .modal-header { border-color: rgba(255,255,255,0.1); background: rgba(30,41,59,0.9); }
        .light .modal-header { border-color: rgba(0,0,0,0.1); background: rgba(255,255,255,0.9); }
    </style>
</head>

    <!-- 1. 导航栏 (含日夜切换) -->
    <nav class="glass-nav fixed top-0 w-full z-50">

    <!-- ==================== 弹窗系统 ==================== -->

    <!-- 1. 二维码弹窗 -->

        </div>
    </div>

    <script>
        // 日夜模式逻辑
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 加载主题
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }

            const d = CONFIG;
            document.getElementById('nav-logo').innerText = d.siteInfo.logoText;
            document.getElementById('nav-btn-text').innerText = d.siteInfo.contactBtnText;
            document.getElementById('course-title').innerText = d.siteInfo.title;
            document.getElementById('modal-qr').src = d.siteInfo.qrCode;
            document.getElementById('modal-wechat').innerText = d.siteInfo.wechatId;
            
            // 设置背景图
            document.getElementById('hero-bg').style.backgroundImage = `linear-gradient(to bottom, rgba(15,23,42,0.6), #0f172a), url('${d.siteInfo.banner}')`;

            const modContainer = document.getElementById('modules-container');
            d.courseModules.forEach(mod => {
                const itemsHtml = mod.items.map(t => `<li class="flex items-start gap-3 mb-2 text-sub text-sm leading-relaxed"><i class="fas fa-check-circle ${mod.color.replace('bg-','text-')} mt-1 flex-shrink-0"></i> <span>${t}</span></li>`).join('');
                modContainer.innerHTML += `<div class="card p-6 md:p-8 flex flex-col md:flex-row gap-6"><div class="w-14 h-14 rounded-xl ${mod.color} bg-opacity-20 flex items-center justify-center text-2xl flex-shrink-0 ${mod.color.replace('bg-','text-')}"><i class="${mod.icon}"></i></div><div class="flex-1"><h3 class="text-xl font-bold text-main mb-4 border-b border-gray-700/20 pb-3">${mod.title}</h3><ul class="pl-2">${itemsHtml}</ul></div></div>`;
            });

            document.getElementById('benefits-list').innerHTML = d.benefits.map(t => `<li class="flex gap-3"><i class="fas fa-star text-yellow-500 mt-1"></i> <span>${t}</span></li>`).join('');
            document.getElementById('promise-list').innerHTML = d.promise.map(t => `<li class="flex gap-3 items-start"><i class="fas fa-shield-alt text-green-400 mt-1 flex-shrink-0"></i> <span>${t}</span></li>`).join('');

            const artList = document.getElementById('articles-list');
            d.articles.forEach((a, index) => {
                artList.innerHTML += `<div class="card p-6 cursor-pointer group h-full flex flex-col"><div class="mb-4"><span class="text-xs text-blue-400 font-mono bg-blue-500/10 px-2 py-1 rounded">${a.date}</span></div><h3 class="text-lg font-bold text-main group-hover:text-blue-500 transition mb-3">${a.title}</h3><p class="text-sm text-sub line-clamp-3 flex-1 mb-4">${a.summary}</p><div class="pt-4 border-t border-gray-700/20 text-xs font-bold text-sub flex justify-between items-center"><span>阅读全文</span> <i class="fas fa-arrow-right group-hover:translate-x-1 transition"></i></div></div>`;
            });

            document.getElementById('inst-name').innerText = d.instructor.name;
            document.getElementById('inst-title').innerText = d.instructor.title;
            document.getElementById('inst-img').src = d.instructor.image;
            document.getElementById('inst-desc').innerHTML = d.instructor.shortDesc.map(p => `<p>${p}</p>`).join('');
            document.getElementById('modal-inst-img').src = d.instructor.image;
            document.getElementById('about-desc').innerHTML = d.about.desc;
        });

        function toggleMobileMenu() { 
            const menu = document.getElementById('mobile-menu-panel');
            const overlay = document.getElementById('mobile-menu-overlay');
            menu.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function toggleContact() {
            const m = document.getElementById('contact-modal');
            const o = document.getElementById('modal-overlay');
            if (m.classList.contains('hidden')) {
                m.classList.remove('hidden'); o.style.display = 'flex';
            } else {
                m.classList.add('hidden'); o.style.display = 'none';
            }
        }
        
        function closeAllModals() {
            document.getElementById('contact-modal').classList.add('hidden');
            document.getElementById('modal-overlay').style.display = 'none';
            // (其他弹窗关闭逻辑同理)
        }

        function copyWechat() { 
            navigator.clipboard.writeText(CONFIG.siteInfo.wechatId).then(() => { 
                document.getElementById('copy-tip').style.opacity = 1; 
                setTimeout(() => document.getElementById('copy-tip').style.opacity = 0, 2000); 
            }); 
        }
    </script>
</body>
</html>
